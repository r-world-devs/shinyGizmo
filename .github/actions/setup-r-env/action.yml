name: Setup R environment
description: >
  Install R, pandoc and the latest CRAN versions of all packages required by
  DESCRIPTION (renv.lock is intentionally ignored). Installed libraries are
  cached by r-lib/actions.

inputs:
  extra-packages:
    description: Extra packages to install (pak syntax, comma or newline separated).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: r-lib/actions/setup-pandoc@v2

    - uses: r-lib/actions/setup-r@v2
      with:
        use-public-rspm: true

    - uses: r-lib/actions/setup-r-dependencies@v2
      with:
        extra-packages: ${{ inputs.extra-packages }}
