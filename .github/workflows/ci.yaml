# R package CI/CD - single branch strategy (port of RWDIE Gitlab CI pipeline).
#
# Runs are triggered in the following ways:
#   1. Automatic: PR targeting dev         -> checks (version compared to dev DESCRIPTION)
#   2. Automatic: push to dev              -> checks (version compared to the latest release tag)
#   3. Manual (Actions -> CI -> Run workflow), no inputs checked
#                                          -> checks (+ docs build with `build_docs`)
#   4. Manual with `publish_docs`          -> checks (no version bump check) + build & publish docs to gh-pages
#   5. Manual with `release`               -> Release Guard, build package, build & publish docs,
#                                             create `v<version>` tag and GitHub release (NEWS.md changelog
#                                             as notes, package tarball attached)
#
# Optional repository variables (Settings -> Secrets and variables -> Actions -> Variables):
#   R_BUILD_OPTS      - extra flags passed to `R CMD build` (default: none)
#   R_CHECK_OPTS      - extra flags passed to `R CMD check` (default: "--no-manual")
#   ALLOW_CHECK_NOTES - "false" (default), "true" (any number of notes) or N (at most N notes)
#   ENABLE_LINTR      - set to "true" to run the Lintr job (disabled by default)
#   DOCS_BUILD_ARGS   - comma separated arguments passed to `pkgdown::build_site()`
#
# Dependencies are installed as the latest CRAN versions based on DESCRIPTION (renv.lock is not used).

name: CI

run-name: >-
  ${{ inputs.release && format('Release - {0}', github.ref_name)
  || format('{0} - {1}', github.event_name, github.head_ref || github.ref_name) }}

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      release:
        description: Run the full release pipeline
        type: boolean
        default: false
      build_docs:
        description: Build documentation without releasing (ignored when release is checked)
        type: boolean
        default: false
      publish_docs:
        description: Build and publish documentation to gh-pages without releasing
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.release && 'release' || 'check' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  RENV_CONFIG_AUTOLOADER_ENABLED: "false"
  TAG_PREFIX: v

jobs:
  setup:
    name: Save Vars
    runs-on: ubuntu-latest
    outputs:
      pkg_name: ${{ steps.vars.outputs.pkg_name }}
      pkg_version: ${{ steps.vars.outputs.pkg_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute package metadata
        id: vars
        run: |
          if [ ! -f DESCRIPTION ]; then
            echo "❌ The pipeline supports only valid R-package projects."
            exit 1
          fi
          PKG_NAME=$(awk -F: '/^Package:/{print $2}' DESCRIPTION | xargs)
          PKG_VERSION=$(awk -F: '/^Version:/{print $2}' DESCRIPTION | xargs)
          echo "pkg_name=$PKG_NAME" >> "$GITHUB_OUTPUT"
          echo "pkg_version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "Package: $PKG_NAME $PKG_VERSION"
          if [ -f NEWS.md ]; then
            awk '/^# /{ if (found) exit; found = 1; next } found' NEWS.md > last_changelog.txt
          else
            touch last_changelog.txt
          fi
          echo "Changelog:"
          cat last_changelog.txt

      - uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: last_changelog.txt

  release-guard:
    name: Release Guard
    needs: setup
    if: inputs.release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      PKG_NAME: ${{ needs.setup.outputs.pkg_name }}
      PKG_VERSION: ${{ needs.setup.outputs.pkg_version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release
        run: |
          echo "=== Release Guard ==="

          # Check 1: DESCRIPTION version must be exactly X.X.X (X.X.X.X not allowed)
          if ! echo "$PKG_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "❌ DESCRIPTION version must be in X.X.X format (X.X.X.X not allowed). Found: $PKG_VERSION"
            exit 1
          fi
          echo "✅ Version format OK: $PKG_VERSION"

          # Check 2: NEWS.md top header must be exactly "# <pkg_name> <pkg_version>"
          if [ ! -f NEWS.md ]; then
            echo "❌ NEWS.md file doesn't exist."
            exit 1
          fi
          EXPECTED_HEADER="# ${PKG_NAME} ${PKG_VERSION}"
          ACTUAL_HEADER=$(head -1 NEWS.md)
          if [ "$ACTUAL_HEADER" != "$EXPECTED_HEADER" ]; then
            echo "❌ NEWS.md top header must be exactly '${EXPECTED_HEADER}', found: '${ACTUAL_HEADER}'"
            exit 1
          fi
          echo "✅ NEWS.md header OK."

          # Check 3: release tag must not exist yet
          if git rev-parse -q --verify "refs/tags/${TAG_PREFIX}${PKG_VERSION}" > /dev/null; then
            echo "❌ Tag ${TAG_PREFIX}${PKG_VERSION} already exists. Bump the package version."
            exit 1
          fi
          echo "✅ Tag ${TAG_PREFIX}${PKG_VERSION} is free."

          # Check 4: there must be a successful (non-release) run of this workflow on this commit
          echo "Checking for successful run on commit $GITHUB_SHA..."
          SUCCESS_FOUND=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yaml \
            --commit "$GITHUB_SHA" --status success --limit 20 --json databaseId,displayTitle \
            --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID and (.displayTitle | startswith(\"Release\") | not))] | length")
          if [ "$SUCCESS_FOUND" -eq 0 ]; then
            echo "❌ No successful run found for this commit. Ensure all checks pass before releasing."
            exit 1
          fi
          echo "✅ Found $SUCCESS_FOUND successful run(s) for this commit."

          echo "=== Release Guard passed ==="

  build:
    name: Build Package
    needs: [setup, release-guard]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    env:
      PKG_NAME: ${{ needs.setup.outputs.pkg_name }}
      PKG_VERSION: ${{ needs.setup.outputs.pkg_version }}
      R_BUILD_OPTS: ${{ vars.R_BUILD_OPTS }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-r-env

      - name: R CMD build
        run: R CMD build $R_BUILD_OPTS .

      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: ${{ env.PKG_NAME }}_${{ env.PKG_VERSION }}.tar.gz

  check:
    name: R CMD check
    needs: [setup, build]
    if: ${{ !inputs.release }}
    runs-on: ubuntu-latest
    env:
      PKG_NAME: ${{ needs.setup.outputs.pkg_name }}
      PKG_VERSION: ${{ needs.setup.outputs.pkg_version }}
      R_CHECK_OPTS: ${{ vars.R_CHECK_OPTS || '--no-manual' }}
      ALLOW_CHECK_NOTES: ${{ vars.ALLOW_CHECK_NOTES || 'false' }}
      _R_CHECK_TESTS_NLINES_: 0
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-r-env

      - uses: actions/download-artifact@v4
        with:
          name: package

      - name: R CMD check
        run: |
          R CMD check $R_CHECK_OPTS ${PKG_NAME}_${PKG_VERSION}.tar.gz || true
          CHECK_LOG="${PKG_NAME}.Rcheck/00check.log"
          INSTALL_LOG="${PKG_NAME}.Rcheck/00install.out"
          CHECK_STATUS=$(awk '/^Status: / {print;}' "$CHECK_LOG" | xargs)
          NOTES_ONLY="Status:  NOTE"
          NO_NUM_NOTES=${CHECK_STATUS//[0-9]/}
          if [ "${CHECK_STATUS}" != "Status: OK" ]; then
            if [ "${NO_NUM_NOTES}" = "${NOTES_ONLY}" ] || [ "${NO_NUM_NOTES}" = "${NOTES_ONLY}s" ]; then
              if [ "${ALLOW_CHECK_NOTES}" = "false" ]; then
                echo "❌ R CMD check failed."
                exit 1
              fi
              N_NOTES=${CHECK_STATUS//[^0-9]/}
              if [ "${ALLOW_CHECK_NOTES}" = "true" ]; then
                echo "Found ${N_NOTES} note(s) - all the notes allowed."
                exit 0
              fi
              if [ "${ALLOW_CHECK_NOTES}" -ge "${N_NOTES}" ]; then
                echo "Found ${N_NOTES} note(s) out of ${ALLOW_CHECK_NOTES} allowed."
                exit 0
              fi
            fi
            if grep -q "Installation failed" "$CHECK_LOG" && [ -f "$INSTALL_LOG" ]; then
              echo "===== Installation log (00install.out) ====="
              cat "$INSTALL_LOG"
              echo "============================================="
            fi
            echo "❌ R CMD check failed"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: check-results
          path: ${{ env.PKG_NAME }}.Rcheck

  check-vbump:
    name: Check VBump
    needs: setup
    if: ${{ !inputs.release && !inputs.publish_docs }}
    runs-on: ubuntu-latest
    env:
      PKG_VERSION: ${{ needs.setup.outputs.pkg_version }}
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version bump
        run: |
          PKG_VERSION_REF=""
          if [ -n "$BASE_REF" ]; then
            # PR context: compare against target branch DESCRIPTION
            echo "Pulling target branch DESCRIPTION file."
            git show "origin/$BASE_REF:DESCRIPTION" 2>/dev/null 1>/tmp/DESCRIPTION || true
            if [ ! -s /tmp/DESCRIPTION ]; then
              echo "No DESCRIPTION file found on the target branch - skipping version comparison."
            else
              PKG_VERSION_REF=$(awk -F: '/^Version:/{print $2}' /tmp/DESCRIPTION | xargs)
            fi
          else
            # Push or manual context: compare against latest release tag
            LATEST_TAG=$(git tag --sort=-v:refname | head -1)
            if [ -z "$LATEST_TAG" ]; then
              echo "No release tags found - skipping version comparison."
            else
              echo "Latest release tag: $LATEST_TAG"
              PKG_VERSION_REF=${LATEST_TAG#"$TAG_PREFIX"}
            fi
          fi

          if [ -n "$PKG_VERSION_REF" ] && [ "${PKG_VERSION}" = "${PKG_VERSION_REF}" ]; then
            echo "❌ No version bumped. Current: $PKG_VERSION, Reference: $PKG_VERSION_REF"
            exit 1
          fi
          if ! echo "$PKG_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "❌ Incorrect version format. X.X.X or X.X.X.X format required."
            exit 1
          fi
          echo "✅ Version bump OK: $PKG_VERSION (reference: ${PKG_VERSION_REF:-none})"

  lintr:
    name: Lintr
    needs: setup
    if: ${{ !inputs.release && vars.ENABLE_LINTR == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-r-env
        with:
          extra-packages: any::lintr

      - name: Lint package
        run: |
          results <- lintr::lint_package()
          print(results)
          quit(save = "no", status = as.integer(length(results) > 0), runLast = FALSE)
        shell: Rscript {0}

  spellcheck:
    name: Spellcheck
    needs: setup
    if: ${{ !inputs.release }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-r-env
        with:
          extra-packages: any::spelling

      - name: Spellcheck package
        run: |
          results <- spelling::spell_check_package()
          print(results)
          quit(save = "no", status = as.integer(nrow(results) > 0), runLast = FALSE)
        shell: Rscript {0}

  build-docs:
    name: Build Docs
    needs: [setup, release-guard]
    if: ${{ !cancelled() && !failure() && (inputs.release || inputs.build_docs || inputs.publish_docs) }}
    runs-on: ubuntu-latest
    env:
      DOCS_BUILD_ARGS: ${{ vars.DOCS_BUILD_ARGS }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-r-env
        with:
          extra-packages: any::pkgdown, local::.

      - name: Build site
        run: Rscript -e "pkgdown::build_site(${DOCS_BUILD_ARGS})"

      - uses: actions/upload-artifact@v4
        with:
          name: docs
          path: docs

  publish-docs:
    name: Publish Docs
    needs: [setup, build-docs]
    if: ${{ !cancelled() && needs.build-docs.result == 'success' && (inputs.release || inputs.publish_docs) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: docs
          path: docs

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs

  publish-release:
    name: Publish Release
    needs: [setup, release-guard, build]
    if: inputs.release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PKG_NAME: ${{ needs.setup.outputs.pkg_name }}
      PKG_VERSION: ${{ needs.setup.outputs.pkg_version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: changelog

      - uses: actions/download-artifact@v4
        with:
          name: package

      - name: Create tag and GitHub release
        run: |
          echo "Release $PKG_NAME $PKG_VERSION"
          gh release create "${TAG_PREFIX}${PKG_VERSION}" "${PKG_NAME}_${PKG_VERSION}.tar.gz" \
            -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$PKG_NAME $PKG_VERSION" \
            --notes-file last_changelog.txt
